name: Build iOS App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci || npm install

      - name: Automatically Patch Capacitor Plugins for Swift
        run: |
          python3 - << 'EOF'
          import os, re
          files = [
              "node_modules/@capacitor/local-notifications/ios/Sources/LocalNotificationsPlugin/LocalNotificationsPlugin.swift",
              "node_modules/@capacitor/splash-screen/ios/Sources/SplashScreenPlugin/SplashScreen.swift",
              "node_modules/@capacitor/splash-screen/ios/Sources/SplashScreenPlugin/SplashScreenPlugin.swift"
          ]
          for filepath in files:
              if os.path.exists(filepath):
                  with open(filepath, "r") as f:
                      content = f.read()
                  # Fix getArray missing default argument
                  content = re.sub(r"call\.getArray\((?![^)]*,\s*\[)([^)]+)\)", r"call.getArray(\1, [])", content)
                  # Fix getString missing default argument
                  content = re.sub(r"call\.getString\((?![^)]*,\s*[\"\'])([^)]+)\)", r"call.getString(\1, \"\")", content)
                  with open(filepath, "w") as f:
                      f.write(content)
                  print(f"Successfully patched {filepath}")
          EOF

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build App Bundle for iOS
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -sdk iphoneos -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Package into IPA for Sideloadly
        run: |
          mkdir -p payload
          cp -r ios/App/build/Build/Products/Release-iphoneos/App.app payload/
          cd payload
          zip -r ../App.ipa App.app
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-ipa
          path: App.ipa